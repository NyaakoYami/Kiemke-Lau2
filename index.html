<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiểm Kê Tài Sản - Sàn Lầu 2 & Lầu 3</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    @keyframes pulseDot {
      0% { transform: scale(0.88); opacity: 0.7; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.88); opacity: 0.7; }
    }

    :root {
      --bg: #f8fafc; --surface: #ffffff; --surface-alt: #f1f5f9;
      --border: #e2e8f0; --text-primary: #0f172a; --text-secondary: #475569;
      --text-muted: #94a3b8; --blue: #2563eb; --blue-light: #eff6ff;
      --green: #16a34a; --green-light: #f0fdf4; --red: #dc2626;
      --red-light: #fef2f2; --yellow: #ca8a04; --yellow-light: #fefce8;
      --purple: #9333ea; --shadow-sm: 0 1px 3px rgba(0, 0, 0, .05);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, .08); --shadow-xl: 0 20px 40px rgba(0, 0, 0, .12);
      --radius: 12px; --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-primary);
      min-height: 100vh; padding: 20px; padding-bottom: 80px;
    }
    .container { max-width: 2000px; margin: 0 auto; }

    /* Header & Status Dot */
    .page-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 55%, #1d4ed8 100%);
      border-radius: 18px; padding: 24px 30px; margin-bottom: 20px;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
      box-shadow: var(--shadow-xl); color: #fff;
    }
    .page-header h1 { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .page-header p { color: #cbd5e1; font-size: 13px; margin-top: 4px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .header-badge { background: rgba(255,255,255,0.15); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; }

    /* Status Dot */
    .status-badge {
      background: var(--surface); color: var(--text-primary); padding: 6px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 8px;
      box-shadow: var(--shadow-sm); border: 1px solid var(--border);
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%; display: inline-block;
      transition: background-color 0.3s ease;
    }

    /* Stat Cards */
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: var(--surface); border-radius: var(--radius); padding: 12px 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); text-align: center; }
    .stat-label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
    .stat-value { font-size: 22px; font-weight: 900; color: var(--text-primary); }

    /* Controls & Floor Filter Bar */
    .controls-panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 20px; margin-bottom: 22px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px;
      box-shadow: var(--shadow-sm);
    }
    .search-wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .search-wrap input { padding: 9px 14px; width: 260px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; outline: none; transition: border-color 0.2s; }
    .search-wrap input:focus { border-color: var(--blue); }

    /* Floor Select Button Bar */
    .floor-select-bar { display: flex; background: var(--surface-alt); padding: 3px; border-radius: var(--radius-sm); border: 1px solid var(--border); gap: 2px; }
    .floor-btn { padding: 7px 14px; font-size: 12px; font-weight: 800; border: none; border-radius: 6px; cursor: pointer; background: transparent; color: var(--text-secondary); transition: all 0.2s; }
    .floor-btn.active { background: var(--text-primary); color: #fff; box-shadow: var(--shadow-sm); }

    .btn { padding: 9px 18px; border: none; border-radius: var(--radius-sm); cursor: pointer; font-weight: 700; font-size: 13px; transition: all 0.18s; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .btn-success { background: var(--green); color: #fff; }
    .btn-success:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Floors & Lanes */
    .floor-block { margin-bottom: 30px; }
    .floor-title { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 20px; font-weight: 900; border-bottom: 2px solid var(--border); padding-bottom: 8px; }

    .lane-row {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow-sm); display: flex; align-items: stretch; overflow-x: auto; min-height: 160px;
    }
    .lane-lead-wrap { display: flex; flex-direction: column; flex-shrink: 0; width: 200px; margin-right: 12px; background: var(--surface-alt); padding: 10px; border-radius: var(--radius); border: 1px solid var(--border); }
    .lane-divider { flex-shrink: 0; width: 32px; display: flex; align-items: center; justify-content: center; position: relative; margin-right: 12px; }
    .lane-divider-bar { width: 4px; height: 100%; background: var(--border); border-radius: 4px; }
    .lane-divider-label { position: absolute; background: var(--yellow); color: #fff; font-weight: 900; font-size: 14px; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); }
    .lane-agents-wrap { display: flex; flex-direction: column; flex: 1; }

    .lane-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .lane-agents-label { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }

    .seat-strip { display: flex; flex-wrap: wrap; gap: 8px; min-height: 80px; padding: 4px; border-radius: 8px; }

    /* Cabin Box & Team Tag */
    .seat-box {
      width: 148px; border-radius: var(--radius); padding: 10px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); flex-shrink: 0; cursor: grab; transition: transform 0.18s, box-shadow 0.18s; background: var(--surface); position: relative;
    }
    .seat-box:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); z-index: 5; }
    .seat-box.lead-box { width: 100%; }

    /* Team Tag styling */
    .team-tag {
      font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .02em;
      background: rgba(255,255,255,0.75); backdrop-filter: blur(4px); border-radius: 999px;
      padding: 2px 7px; width: fit-content; border: 1px solid rgba(0,0,0,0.08); transition: all 0.2s;
      cursor: pointer; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 6px; user-select: none;
    }
    .team-tag:hover { background: #fff; border-color: rgba(37,99,235,0.35); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .team-tag-selected { background: #eff6ff !important; border-color: #3b82f6 !important; color: #1d4ed8 !important; }
    .team-tag-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    /* Team Gradients */
    .fill-lead { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%) !important; border-color: #93c5fd !important; }
    .fill-pink { background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%) !important; border-color: #f9a8d4 !important; }
    .fill-orange { background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%) !important; border-color: #fdba74 !important; }
    .fill-cyan { background: linear-gradient(135deg, #ecfeff 0%, #cffafe 100%) !important; border-color: #67e8f9 !important; }
    .fill-yellow { background: linear-gradient(135deg, #fefce8 0%, #fef3c7 100%) !important; border-color: #fcd34d !important; }
    .fill-purple { background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%) !important; border-color: #c4b5fd !important; }
    .fill-grey { background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%) !important; border-color: #cbd5e1 !important; opacity: 0.85; }

    .team-tag-dot.fill-lead { background-color: #2563eb; }
    .team-tag-dot.fill-pink { background-color: #ec4899; }
    .team-tag-dot.fill-orange { background-color: #f97316; }
    .team-tag-dot.fill-cyan { background-color: #06b6d4; }
    .team-tag-dot.fill-yellow { background-color: #eab308; }
    .team-tag-dot.fill-purple { background-color: #8b5cf6; }
    .team-tag-dot.fill-grey { background-color: #6b7280; }

    /* Inline Edit Display */
    .inline-edit-display {
      font-weight: 700; opacity: 0.92; padding: 3px 6px; border-radius: 5px; border: 1px solid transparent;
      background: transparent; box-shadow: none; color: #1e293b; transition: all 0.2s; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-block;
    }
    .inline-edit-display:hover { opacity: 1; border-color: rgba(59,91,219,0.3); background: rgba(255,255,255,0.7); }
    .inline-edit-display.stt-display { font-size: 11px; font-weight: 800; color: #2563eb; background: rgba(37,99,235,0.08); padding: 1px 5px; border-radius: 4px; }

    /* Quick buttons (Check đủ bộ & Reset) */
    .btn-action-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .btn-mini { padding: 3px 6px; font-size: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: 800; background: rgba(255,255,255,0.8); transition: all 0.15s; }
    .btn-mini:hover { transform: scale(1.08); }
    .btn-mini-success { color: var(--green); }
    .btn-mini-reset { color: var(--text-secondary); }
    .btn-mini-danger { color: var(--red); }

    /* Hover Team Picker Popover */
    .team-popover {
      display: none; position: absolute; top: 28px; left: 0; background: var(--surface); border: 1px solid var(--border);
      padding: 8px; border-radius: var(--radius); box-shadow: var(--shadow-xl); z-index: 100; width: 170px; flex-direction: column; gap: 4px;
    }
    .team-tag-wrap { position: relative; display: inline-block; }
    .team-tag-wrap:hover .team-popover { display: flex; }
    .team-option {
      display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 700; transition: background 0.15s;
    }
    .team-option:hover { background: var(--surface-alt); }
    .team-option.selected { background: #eff6ff; border: 1px solid var(--blue); color: var(--blue); }

    /* Checklist */
    .items-list { display: flex; flex-direction: column; gap: 3px; background: rgba(255,255,255,0.7); padding: 6px; border-radius: 8px; margin-top: 6px; }
    .item-check { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--text-secondary); cursor: pointer; }
    .item-check input[type=checkbox] { cursor: pointer; width: 12px; height: 12px; accent-color: var(--green); }

    #toast { position: fixed; bottom: 24px; right: 24px; background: #0f172a; color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 700; display: none; z-index: 9999; box-shadow: var(--shadow-xl); }
    #toast.show { display: block; }
  </style>
</head>

<body>
  <div class="container">
    <!-- Header -->
    <div class="page-header">
      <div>
        <h1>📋 Kiểm Kê Tài Sản - Sàn Lầu 2 &amp; Lầu 3</h1>
        <p>Phiên bản Nâng cấp: Tự động đổi màu Team • Inline Edit • Trạng thái Supabase Cloud</p>
      </div>
      <div class="header-right">
        <span class="header-badge" id="date-badge"></span>
        <div class="status-badge">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Đang kết nối...</span>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="detail-grid">
      <div class="stat-card"><div class="stat-label">📦 Thùng máy</div><div class="stat-value" id="count-thung">0</div></div>
      <div class="stat-card"><div class="stat-label">🖥️ Màn 20"</div><div class="stat-value" id="count-man20">0</div></div>
      <div class="stat-card"><div class="stat-label">🖥️✨ Màn 24"</div><div class="stat-value" id="count-man24">0</div></div>
      <div class="stat-card"><div class="stat-label">🖱️ Chuột</div><div class="stat-value" id="count-chuot">0</div></div>
      <div class="stat-card"><div class="stat-label">⌨️ Phím</div><div class="stat-value" id="count-phim">0</div></div>
      <div class="stat-card"><div class="stat-label">🎧 Tai USB</div><div class="stat-value" id="count-tai">0</div></div>
      <div class="stat-card"><div class="stat-label">💻 Laptop</div><div class="stat-value" id="count-laptop">0</div></div>
      <div class="stat-card"><div class="stat-label">👥 Tổng chỗ</div><div class="stat-value" id="count-seats">0</div></div>
    </div>

    <!-- Controls Panel -->
    <div class="controls-panel">
      <div class="search-wrap">
        <input type="text" id="search-input" placeholder="🔍 Tìm tên Agent hoặc STT..." oninput="renderApp()">
        
        <!-- Bộ Lọc Sàn Lầu -->
        <div class="floor-select-bar">
          <button class="floor-btn active" onclick="setFloorFilter('Tất cả', this)">Tất cả</button>
          <button class="floor-btn" onclick="setFloorFilter('Sàn Lầu 2', this)">Sàn Lầu 2</button>
          <button class="floor-btn" onclick="setFloorFilter('Sàn Lầu 3', this)">Sàn Lầu 3</button>
        </div>
      </div>

      <div>
        <button class="btn btn-success" id="btn-sync" onclick="syncOnline()">☁️ Lưu Cloud</button>
      </div>
    </div>

    <!-- Floors Container -->
    <div id="floors-container"></div>
  </div>

  <div id="toast"></div>

  <script>
    document.getElementById('date-badge').innerText = new Date().toLocaleDateString('vi-VN', { weekday: 'short', year: 'numeric', month: '2-digit', day: '2-digit' });

    // Cấu hình Supabase
    const SUPABASE_URL = "https://josvegctuwnxfpjynlxn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_76ErkOKmFh5t1ykxRKBfIA_DDn9srEc";
    let supabaseClient = null;
    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    const teamColors = [
      { id: 'fill-lead', name: 'Lead', dotColor: '#2563eb' },
      { id: 'fill-pink', name: 'User', dotColor: '#ec4899' },
      { id: 'fill-orange', name: 'Social', dotColor: '#f97316' },
      { id: 'fill-cyan', name: 'Merchant', dotColor: '#06b6d4' },
      { id: 'fill-yellow', name: 'Night/Senior', dotColor: '#eab308' },
      { id: 'fill-purple', name: 'SPT/PT', dotColor: '#8b5cf6' },
      { id: 'fill-grey', name: 'Trống', dotColor: '#6b7280' }
    ];

    const genId = () => 's_' + Math.random().toString(36).substr(2, 9);

    const defaultData = [
      {
        floorName: "Sàn Lầu 3",
        lanes: [
          { laneLetter: "A", startStt: 18, leads: [{id: genId(), name: "Thu Hiền - TL"}], agents: [
            "Trần Chi", "Nguyễn Trâm", "Trần Trinh", "Nguyễn Thiên", "Đoàn Giao", "NB Content", "NB Content",
            "Lê Trinh", "Nguyễn Tỷ", "Cao Nhung", "Huỳnh Ngà", "Huỳnh Châu", "Lê Châu", "Trống", "Trống"
          ].map((n, i) => ({id: genId(), name: n, stt: 18 + i})) },
          
          { laneLetter: "B", startStt: 38, leads: [{id: genId(), name: "Vy - DA"}], agents: [
            "Nguyễn Khanh", "Lý - Senior", "Nguyễn Hậu", "Võ Hiền", "Phan Loan", "Võ Lan", "NB Content", "NB Content", "Tuyến - Senior", "Nguyễn Thúy"
          ].map((n, i) => ({id: genId(), name: n, stt: 38 + i})) },
          
          { laneLetter: "C", startStt: 48, leads: [{id: genId(), name: "Lead Hỗ Trợ"}], agents: [
            "Huỳnh Giang", "Trần Tâm", "Nguyễn Phương", "Ngô Hằng", "Lai Nghi", "NB Tele", "Trống", "Trống", "Trống", "Trống"
          ].map((n, i) => ({id: genId(), name: n, stt: 48 + i})) },

          { laneLetter: "D", startStt: 58, leads: [{id: genId(), name: "Anh Thư - SUP"}], agents: [
            "Full", "Full", "PT - Phúc Hậu", "Trung Hiếu", "Quốc Khánh", "Trống", "Nhung Huỳnh", "Yến Ly", "Gia Hưng", "Bích Quỳnh", "PT - Phương Thy", "PT - Khánh Vy", "PT - Liên Anh", "PT - Thu Hồng", "PT - Loan", "PT - Cắt Tường", "PT - Khoa"
          ].map((n, i) => ({id: genId(), name: n, stt: 58 + i})) }
        ]
      },
      {
        floorName: "Sàn Lầu 2",
        lanes: [
          { laneLetter: "A", startStt: 1, leads: [{id: genId(), name: "Oanh - Senior TL"}], agents: [
            "Trống", "Thiên Kim Senior", "Kim Ái Senior", "Huy Hoàng", "Diệu Trinh", "PT Thảo Phương", "PT Sỹ Danh", "PT Trúc Linh", "PT Thu Hiền", "Full", "PT Thành Đạt", "Full", "PT - Gia Hân", "PT - Sang", "PT - Trang", "PT - Huy", "PT - Gia Bội", "PT - Hào"
          ].map((n, i) => ({id: genId(), name: n, stt: 1 + i})) },
          
          { laneLetter: "B", startStt: 19, leads: [{id: genId(), name: "Chinh - TL"}], agents: [
            "Thiên Ngân", "Tú Trinh", "Trung Nghị", "Minh Tâm", "Minh Thư", "Duy Khánh", "Hồng Ân", "Nhật Lam", "Khánh Ly", "Hoàng Gấm NB", "Hoàng Khải", "Phi Phụng", "Bảo Anh Senior", "Ngọc Tú", "Uyên", "Thanh", "PT Bảo My", "Full", "Cảnh", "Trúc"
          ].map((n, i) => ({id: genId(), name: n, stt: 19 + i})) },

          { laneLetter: "C", startStt: 39, leads: [{id: genId(), name: "Lead Hỗ Trợ 2"}], agents: [
            "Thiếu 1 màn hình", "Full", "Trực", "Kim Ngân", "Đan Vy", "Nguyễn Senior", "Thắng", "Full", "Nguyễn Kim Ngân", "Thị Thủy", "Ý Lan", "Hải Yến", "Ái Linh", "Hân Senior", "Minh Thái", "Quang Hậu", "Công Hiệp", "Full", "Minh Hoàng"
          ].map((n, i) => ({id: genId(), name: n, stt: 39 + i})) },

          { laneLetter: "D", startStt: 59, leads: [{id: genId(), name: "Phương - TL QA"}], agents: [
            "Hoàng Khôi", "Minh Đạo", "Văn Anh", "Kim Chi", "Thảo Vi", "Thừa Nghiên", "Mai Xuân", "Thị Quỳnh", "Nguyễn Nhi", "Thị Hồng", "Chấn Điền", "Nhật Khánh", "Tú Quyền", "Tân Tài", "Tuấn Anh", "Toàn"
          ].map((n, i) => ({id: genId(), name: n, stt: 59 + i})) }
        ]
      }
    ];

    let appState = {
      floors: JSON.parse(JSON.stringify(defaultData)),
      inventory: {},
      colors: {}
    };

    let selectedFloor = "Tất cả";
    let selectedTeamId = null;
    let syncStatus = "synced"; // synced | dirty | syncing | error
    let connectionStatus = "checking"; // checking | connected | error

    function autoColor(name) {
      const n = (name || "").toUpperCase();
      if (n.includes("TRỐNG") || n === "") return "fill-grey";
      if (n.includes("SENIOR") || n.includes("TRAINER")) return "fill-yellow";
      if (n.startsWith("PT") || n.includes("PT -") || n.includes("PT ")) return "fill-purple";
      if (n.includes("NB ")) return "fill-orange";
      if (n === "FULL") return "fill-cyan";
      return "fill-pink";
    }

    function teamNameOf(colorId) {
      const t = teamColors.find(c => c.id === colorId);
      return t ? t.name : "Khác";
    }

    function updateStatusDot() {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      if (!dot || !text) return;

      let color = "#ef4444";
      let label = "Mất kết nối Cloud";
      let pulse = false;

      if (connectionStatus === "checking") {
        color = "#3b82f6"; label = "Đang kiểm tra..."; pulse = true;
      } else if (connectionStatus === "error") {
        color = "#ef4444"; label = "Lỗi Supabase"; pulse = false;
      } else if (connectionStatus === "connected") {
        if (syncStatus === "syncing") {
          color = "#eab308"; label = "Đang lưu Cloud..."; pulse = true;
        } else if (syncStatus === "synced") {
          color = "#22c55e"; label = "Đã đồng bộ"; pulse = false;
        } else {
          color = "#3b82f6"; label = "Chưa lưu lên Cloud"; pulse = true;
        }
      }

      dot.style.backgroundColor = color;
      dot.style.boxShadow = `0 0 0 3px ${color}33`;
      dot.style.animation = pulse ? "pulseDot 1.1s ease-in-out infinite" : "none";
      text.innerText = label;
    }

    function markDirty() {
      syncStatus = "dirty";
      updateStatusDot();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function setFloorFilter(floor, btn) {
      selectedFloor = floor;
      document.querySelectorAll('.floor-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderApp();
    }

    function toggleTeamFilter(colorId) {
      if (selectedTeamId === colorId) selectedTeamId = null;
      else selectedTeamId = colorId;
      renderApp();
    }

    function changeSeatColor(id, colorId) {
      appState.colors[id] = colorId;
      markDirty();
      renderApp();
    }

    function markFull(id, isLead) {
      if (!appState.inventory[id]) appState.inventory[id] = {};
      const inv = appState.inventory[id];
      inv.thung = true; inv.man20 = true; inv.chuot = true; inv.phim = true; inv.tai = true;
      if (isLead) { inv.man24 = true; inv.laptop = true; }
      markDirty();
      renderApp();
    }

    function markReset(id) {
      if (!appState.inventory[id]) return;
      const inv = appState.inventory[id];
      Object.keys(inv).forEach(k => { if (typeof inv[k] === 'boolean') inv[k] = false; });
      markDirty();
      renderApp();
    }

    function updateInventoryCheck(id, key, checked) {
      if (!appState.inventory[id]) appState.inventory[id] = {};
      appState.inventory[id][key] = checked;
      markDirty();
      updateStats();
    }

    function updateSeatProp(fIdx, lIdx, type, sIdx, prop, val) {
      const arr = type === 'lead' ? appState.floors[fIdx].lanes[lIdx].leads : appState.floors[fIdx].lanes[lIdx].agents;
      arr[sIdx][prop] = prop === 'stt' ? (parseInt(val) || val) : val;
      markDirty();
      renderApp();
    }

    function addSeat(fIdx, lIdx, type) {
      const lane = appState.floors[fIdx].lanes[lIdx];
      const id = genId();
      if (type === 'lead') {
        lane.leads.push({ id, name: "Lead Mới" });
      } else {
        const lastStt = lane.agents.length > 0 ? (parseInt(lane.agents[lane.agents.length - 1].stt) || 0) : lane.startStt;
        lane.agents.push({ id, name: "Trống", stt: lastStt + 1 });
      }
      markDirty();
      renderApp();
    }

    function removeSeat(fIdx, lIdx, type, sIdx) {
      if (!confirm("Bạn muốn xoá cabin này?")) return;
      const arr = type === 'lead' ? appState.floors[fIdx].lanes[lIdx].leads : appState.floors[fIdx].lanes[lIdx].agents;
      const item = arr[sIdx];
      arr.splice(sIdx, 1);
      delete appState.inventory[item.id];
      delete appState.colors[item.id];
      markDirty();
      renderApp();
    }

    async function loadOnline() {
      connectionStatus = "checking";
      updateStatusDot();
      if (!supabaseClient) {
        connectionStatus = "error";
        updateStatusDot();
        return;
      }
      try {
        const { data, error } = await supabaseClient.from('inventory_sync').select('*').eq('id', 1).single();
        if (error && error.code !== 'PGRST116') throw error;
        connectionStatus = "connected";
        if (data && data.data && data.data.floors) {
          appState = data.data;
          syncStatus = "synced";
          showToast("✅ Đã tải dữ liệu từ Supabase Cloud");
        }
      } catch (e) {
        console.error(e);
        connectionStatus = "error";
      }
      updateStatusDot();
      renderApp();
    }

    async function syncOnline() {
      if (!supabaseClient) return;
      const btn = document.getElementById('btn-sync');
      btn.disabled = true;
      syncStatus = "syncing";
      updateStatusDot();
      try {
        const { error } = await supabaseClient.from('inventory_sync').upsert({
          id: 1,
          data: appState,
          updated_at: new Date().toISOString()
        });
        if (error) throw error;
        connectionStatus = "connected";
        syncStatus = "synced";
        showToast("☁️ Lưu Cloud thành công!");
      } catch (e) {
        console.error(e);
        connectionStatus = "error";
        syncStatus = "error";
        showToast("❌ Lỗi lưu Cloud: " + e.message);
      } finally {
        btn.disabled = false;
        updateStatusDot();
      }
    }

    function updateStats() {
      let thung = 0, man20 = 0, man24 = 0, chuot = 0, phim = 0, tai = 0, laptop = 0, seats = 0;
      Object.values(appState.inventory).forEach(inv => {
        seats++;
        if (inv.thung) thung++;
        if (inv.man20) man20++;
        if (inv.man24) man24++;
        if (inv.chuot) chuot++;
        if (inv.phim) phim++;
        if (inv.tai) tai++;
        if (inv.laptop) laptop++;
      });
      document.getElementById('count-thung').innerText = thung;
      document.getElementById('count-man20').innerText = man20;
      document.getElementById('count-man24').innerText = man24;
      document.getElementById('count-chuot').innerText = chuot;
      document.getElementById('count-phim').innerText = phim;
      document.getElementById('count-tai').innerText = tai;
      document.getElementById('count-laptop').innerText = laptop;
      document.getElementById('count-seats').innerText = seats;
    }

    function renderApp() {
      const search = (document.getElementById('search-input')?.value || "").toLowerCase();
      const container = document.getElementById('floors-container');
      container.innerHTML = "";

      appState.floors.forEach((floor, fIdx) => {
        if (selectedFloor !== "Tất cả" && floor.floorName !== selectedFloor) return;

        const floorEl = document.createElement('div');
        floorEl.className = 'floor-block';
        floorEl.innerHTML = `<div class="floor-title">🏢 ${floor.floorName}</div>`;

        floor.lanes.forEach((lane, lIdx) => {
          const laneEl = document.createElement('div');
          laneEl.className = 'lane-row';

          // --- LEAD ZONE ---
          let leadsHtml = lane.leads.filter(s => {
            const q = s.name.toLowerCase().includes(search);
            const colorId = appState.colors[s.id] || 'fill-lead';
            return q && (!selectedTeamId || colorId === selectedTeamId);
          }).map((seat, sIdx) => {
            const colorId = appState.colors[seat.id] || 'fill-lead';
            const inv = appState.inventory[seat.id] || {};
            const isSelectedTeam = selectedTeamId === colorId;

            return `
              <div class="seat-box lead-box ${colorId}">
                <div class="btn-action-row">
                  <div>
                    <button class="btn-mini btn-mini-success" onclick="markFull('${seat.id}', true)" title="Check Đủ bộ">✔️</button>
                    <button class="btn-mini btn-mini-reset" onclick="markReset('${seat.id}')" title="Reset checklist">🔄</button>
                  </div>
                  <button class="btn-mini btn-mini-danger" onclick="removeSeat(${fIdx}, ${lIdx}, 'lead', ${sIdx})">✕</button>
                </div>

                <div class="team-tag-wrap">
                  <div class="team-tag ${isSelectedTeam ? 'team-tag-selected' : ''}" onclick="toggleTeamFilter('${colorId}')">
                    <span class="team-tag-dot ${colorId}"></span>
                    <span>${teamNameOf(colorId)}</span> ▾
                  </div>
                  <div class="team-popover">
                    ${teamColors.map(c => `
                      <div class="team-option ${colorId === c.id ? 'selected' : ''}" onclick="changeSeatColor('${seat.id}', '${c.id}')">
                        <span class="team-tag-dot ${c.id}"></span>
                        <span>${c.name}</span>
                        ${colorId === c.id ? ' ✔' : ''}
                      </div>
                    `).join('')}
                  </div>
                </div>

                <span class="inline-edit-display" onclick="editInlineText(this, (v)=>updateSeatProp(${fIdx},${lIdx},'lead',${sIdx},'name',v))">${seat.name}</span>

                <div class="items-list">
                  ${['thung','man20','man24','chuot','phim','tai','laptop'].map(k => `
                    <label class="item-check">
                      <input type="checkbox" ${inv[k] ? 'checked' : ''} onchange="updateInventoryCheck('${seat.id}', '${k}', this.checked)">
                      <span>${k === 'thung' ? 'Thùng' : k === 'man20' ? 'Màn 20"' : k === 'man24' ? 'Màn 24"' : k === 'chuot' ? 'Chuột' : k === 'phim' ? 'Phím' : k === 'tai' ? 'Tai USB' : 'Laptop'}</span>
                    </label>
                  `).join('')}
                </div>
              </div>
            `;
          }).join('');

          // --- AGENTS ZONE ---
          let agentsHtml = lane.agents.filter(s => {
            const q = `${s.name} ${s.stt}`.toLowerCase().includes(search);
            const colorId = appState.colors[s.id] || autoColor(s.name);
            return q && (!selectedTeamId || colorId === selectedTeamId);
          }).map((seat, sIdx) => {
            const colorId = appState.colors[seat.id] || autoColor(seat.name);
            const inv = appState.inventory[seat.id] || {};
            const isSelectedTeam = selectedTeamId === colorId;

            return `
              <div class="seat-box ${colorId}">
                <div class="btn-action-row">
                  <div>
                    <button class="btn-mini btn-mini-success" onclick="markFull('${seat.id}', false)" title="Check Đủ bộ">✔️</button>
                    <button class="btn-mini btn-mini-reset" onclick="markReset('${seat.id}')" title="Reset checklist">🔄</button>
                  </div>
                  <button class="btn-mini btn-mini-danger" onclick="removeSeat(${fIdx}, ${lIdx}, 'agent', ${sIdx})">✕</button>
                </div>

                <div class="team-tag-wrap">
                  <div class="team-tag ${isSelectedTeam ? 'team-tag-selected' : ''}" onclick="toggleTeamFilter('${colorId}')">
                    <span class="team-tag-dot ${colorId}"></span>
                    <span>${teamNameOf(colorId)}</span> ▾
                  </div>
                  <div class="team-popover">
                    ${teamColors.map(c => `
                      <div class="team-option ${colorId === c.id ? 'selected' : ''}" onclick="changeSeatColor('${seat.id}', '${c.id}')">
                        <span class="team-tag-dot ${c.id}"></span>
                        <span>${c.name}</span>
                        ${colorId === c.id ? ' ✔' : ''}
                      </div>
                    `).join('')}
                  </div>
                </div>

                <div style="display:flex; align-items:center; gap:4px; margin-top:2px;">
                  <span class="inline-edit-display stt-display" onclick="editInlineText(this, (v)=>updateSeatProp(${fIdx},${lIdx},'agent',${sIdx},'stt',v))">${seat.stt}</span>
                  <span class="inline-edit-display" onclick="editInlineText(this, (v)=>updateSeatProp(${fIdx},${lIdx},'agent',${sIdx},'name',v))">${seat.name}</span>
                </div>

                <div class="items-list">
                  ${['thung','man20','chuot','phim','tai'].map(k => `
                    <label class="item-check">
                      <input type="checkbox" ${inv[k] ? 'checked' : ''} onchange="updateInventoryCheck('${seat.id}', '${k}', this.checked)">
                      <span>${k === 'thung' ? 'Thùng' : k === 'man20' ? 'Màn 20"' : k === 'chuot' ? 'Chuột' : k === 'phim' ? 'Phím' : 'Tai nghe'}</span>
                    </label>
                  `).join('')}
                </div>
              </div>
            `;
          }).join('');

          laneEl.innerHTML = `
            <div class="lane-lead-wrap">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <span class="lane-agents-label">👑 LEAD DÃY ${lane.laneLetter}</span>
                <button class="btn-mini btn-mini-success" onclick="addSeat(${fIdx}, ${lIdx}, 'lead')">＋</button>
              </div>
              <div class="seat-strip">${leadsHtml}</div>
            </div>

            <div class="lane-divider">
              <div class="lane-divider-bar"></div>
              <div class="lane-divider-label">${lane.laneLetter}</div>
            </div>

            <div class="lane-agents-wrap">
              <div class="lane-header-row">
                <span class="lane-agents-label">👥 AGENTS DÃY ${lane.laneLetter}</span>
                <button class="btn-mini btn-mini-success" onclick="addSeat(${fIdx}, ${lIdx}, 'agent')">＋ Thêm Agent</button>
              </div>
              <div class="seat-strip">${agentsHtml}</div>
            </div>
          `;

          floorEl.appendChild(laneEl);
        });

        container.appendChild(floorEl);
      });

      updateStats();
      updateStatusDot();
    }

    function editInlineText(el, onSave) {
      const current = el.innerText;
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.value = current;
      inp.style.width = '100%';
      inp.style.fontSize = '12px';
      inp.style.fontWeight = '700';
      inp.style.padding = '2px';
      inp.style.borderRadius = '4px';
      inp.style.border = '1.5px solid var(--blue)';

      const save = () => {
        if (inp.value !== current) onSave(inp.value);
        renderApp();
      };

      inp.onblur = save;
      inp.onkeydown = (e) => { if (e.key === 'Enter') save(); };
      el.replaceWith(inp);
      inp.focus();
    }

    // Load initial
    loadOnline();
  </script>
</body>

</html>
