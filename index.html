<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiểm Kê Tài Sản - Sàn Lầu 2 & Lầu 3</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-18px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(16px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes popIn {
      0% {
        transform: scale(.85);
        opacity: 0
      }

      70% {
        transform: scale(1.05);
        opacity: 1
      }

      100% {
        transform: scale(1)
      }
    }

    @keyframes toastSlide {
      from {
        opacity: 0;
        transform: translateX(60px)
      }

      to {
        opacity: 1;
        transform: translateX(0)
      }
    }

    @keyframes toastFade {
      from {
        opacity: 1;
        transform: translateX(0)
      }

      to {
        opacity: 0;
        transform: translateX(60px)
      }
    }

    @keyframes pageReveal {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes headerGlow {

      0%,
      100% {
        box-shadow: 0 8px 40px rgba(59, 91, 219, .25)
      }

      50% {
        box-shadow: 0 8px 40px rgba(112, 72, 232, .35)
      }
    }

    :root {
      --bg: #f0f2f7;
      --surface: #fff;
      --surface-alt: #f8f9fc;
      --border: #e2e6ef;
      --text-primary: #1a1d2e;
      --text-secondary: #6b7280;
      --text-muted: #9ca3af;
      --blue: #3b5bdb;
      --blue-light: #eef2ff;
      --blue-dark: #2f4ac0;
      --green: #2f9e44;
      --green-light: #ebfbee;
      --red: #e03131;
      --red-light: #fff5f5;
      --yellow: #f59f00;
      --yellow-light: #fff9db;
      --purple: #7048e8;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, .07), 0 1px 2px rgba(0, 0, 0, .04);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, .08), 0 2px 4px rgba(0, 0, 0, .04);
      --shadow-xl: 0 20px 60px rgba(0, 0, 0, .14);
      --radius: 10px;
      --radius-sm: 6px;
      --transition: .18s cubic-bezier(.4, 0, .2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
      padding-bottom: 80px;
      animation: pageReveal .45s cubic-bezier(.25, .46, .45, .94) both
    }

    .container {
      max-width: 2000px;
      margin: 0 auto
    }

    .page-header {
      background: linear-gradient(135deg, #1a1d2e 0%, #2d3561 55%, #3b5bdb 100%);
      border-radius: 16px;
      padding: 26px 34px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: var(--shadow-xl);
      animation: fadeInDown .55s ease both, headerGlow 4s ease-in-out infinite
    }

    .page-header-left h1 {
      color: #fff;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: -.5px
    }

    .page-header-left p {
      color: rgba(255, 255, 255, .65);
      font-size: 13px;
      margin-top: 4px
    }

    .header-right {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap
    }

    .header-badge {
      background: rgba(255, 255, 255, .12);
      border: 1px solid rgba(255, 255, 255, .22);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600
    }

    .legend {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary)
    }

    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 10px;
      margin-bottom: 18px
    }

    .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 10px 13px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadeInUp .45s ease both
    }

    .stat-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted)
    }

    .stat-value {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1
    }

    .controls-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: var(--shadow-sm)
    }

    .search-wrap {
      position: relative
    }

    .search-wrap input {
      padding: 9px 12px 9px 36px;
      width: 280px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      outline: none;
      background: var(--surface-alt)
    }

    .search-wrap input:focus {
      border-color: var(--blue)
    }

    .search-wrap .icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted)
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      transition: transform var(--transition), box-shadow var(--transition)
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md)
    }

    .btn-primary {
      background: var(--blue);
      color: #fff
    }

    .btn-success {
      background: var(--green);
      color: #fff
    }

    .btn-warning {
      background: var(--yellow);
      color: #fff
    }

    .btn-danger {
      background: #fff;
      color: var(--red);
      border: 1px solid #fca5a5
    }

    .floor-block {
      margin-bottom: 26px
    }

    .floor-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px
    }

    .floor-title h2 {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary)
    }

    .floor-title span.count-badge {
      background: var(--blue-light);
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px
    }

    /* ─── DÃY (LANE) ─── */
    .lane-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: stretch;
      gap: 0;
      overflow-x: auto
    }

    .lane-lead-wrap {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      margin-right: 10px
    }

    .lane-lead-label {
      font-size: 10px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px
    }

    /* Vách ngăn giữa Lead và Agent, mang nhãn A/B/C/D */
    .lane-divider {
      flex-shrink: 0;
      width: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 10px;
      position: relative
    }

    .lane-divider-bar {
      width: 3px;
      height: 100%;
      background: repeating-linear-gradient(180deg, #c8d0db 0 6px, transparent 6px 12px);
      border-radius: 2px
    }

    .lane-divider-label {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: #1a1d2e;
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md)
    }

    .lane-agents-wrap {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0
    }

    .lane-agents-label {
      font-size: 10px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px
    }

    .seat-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .seat-box {
      width: 120px;
      border-radius: var(--radius-sm);
      padding: 8px 9px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      transition: transform var(--transition), box-shadow var(--transition);
      flex-shrink: 0
    }

    .seat-box:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      z-index: 2
    }

    .seat-box.empty-seat {
      opacity: .55
    }

    .seat-box.lead-box {
      width: 150px
    }

    .fill-purple {
      background-color: #f0ebff;
      border-color: #c5b4f5
    }

    .fill-pink {
      background-color: #fff0f6;
      border-color: #fbb6ce
    }

    .fill-yellow {
      background-color: var(--yellow-light);
      border-color: #ffe066
    }

    .fill-green {
      background-color: var(--green-light);
      border-color: #b2f2bb
    }

    .fill-red {
      background-color: var(--red-light);
      border-color: #fca5a5
    }

    .fill-orange {
      background-color: #fff4e6;
      border-color: #ffd8a8
    }

    .fill-cyan {
      background-color: #e3fafc;
      border-color: #99e9f2
    }

    .fill-grey {
      background-color: #f1f3f5;
      border-color: #dee2e6
    }

    .fill-lead {
      background-color: #e7f5ff;
      border-color: #74c0fc
    }

    .seat-stt {
      font-size: 9px;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 2px;
      cursor: pointer;
      border-radius: 3px;
      padding: 2px 3px;
      display: inline-block
    }

    .seat-stt:hover {
      background: rgba(59, 91, 219, .10);
      color: var(--blue)
    }

    .seat-stt-input {
      width: 55px;
      padding: 2px 4px;
      font-size: 9px;
      font-weight: 800;
      border: 1.5px solid var(--blue);
      border-radius: 4px;
      outline: none
    }

    .lane-stt-title {
      cursor: pointer;
      border-radius: 5px;
      padding: 3px 6px;
      display: inline-block
    }

    .lane-stt-title:hover {
      background: var(--blue-light);
      color: var(--blue)
    }

    .lane-stt-input {
      width: 46px;
      padding: 3px 4px;
      border: 1.5px solid var(--blue);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 800;
      outline: none
    }

    .seat-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 5px;
      gap: 4px
    }

    .seat-name {
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      border-radius: 3px;
      padding: 1px 3px;
      line-height: 1.25;
      flex: 1
    }

    .seat-name:hover {
      background: rgba(0, 0, 0, .05)
    }

    .rename-input {
      font-weight: 700;
      font-size: 11px;
      border: 1.5px solid var(--blue);
      border-radius: 4px;
      padding: 2px 4px;
      outline: none;
      width: 100%;
      animation: popIn .2s ease
    }

    .btn-action-group {
      display: flex;
      gap: 3px;
      margin-bottom: 5px
    }

    .btn-mini {
      padding: 2px 5px;
      font-size: 8.5px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 700;
      font-family: 'Inter', sans-serif
    }

    .btn-mini-success {
      background: var(--green);
      color: #fff
    }

    .btn-mini-danger {
      background: #e5e7eb;
      color: #6b7280
    }

    .btn-mini-danger:hover {
      background: #fca5a5;
      color: var(--red)
    }

    .color-picker-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, .5);
      z-index: 10000;
      align-items: center;
      justify-content: center
    }

    .color-picker-modal.show {
      display: flex
    }

    .color-picker-content {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-xl);
      max-width: 400px;
      width: 90%
    }

    .color-picker-content h3 {
      margin-bottom: 16px;
      color: var(--text-primary)
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px
    }

    .color-option {
      padding: 12px;
      border: 2px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      transition: all var(--transition)
    }

    .color-option:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow-md)
    }

    .color-option.active {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-light)
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end
    }

    .modal-footer .btn {
      padding: 8px 14px;
      font-size: 12px
    }

    /* Chữ nhỏ checklist xếp thành 1 cột gọn bên dưới tên */
    .items-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: rgba(255, 255, 255, .7);
      padding: 5px 6px;
      border-radius: 5px
    }

    .item-check {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 9px;
      font-weight: 600;
      color: var(--text-secondary);
      padding: 1px 2px;
      border-radius: 3px
    }

    .item-check input[type=checkbox] {
      cursor: pointer;
      width: 10px;
      height: 10px;
      accent-color: var(--green);
      flex-shrink: 0
    }

    .item-check .item-lbl {
      flex: 1
    }

    .qty-input {
      width: 24px;
      padding: 0 2px;
      font-size: 9px;
      border: 1px solid var(--border);
      border-radius: 3px;
      text-align: center;
      outline: none;
      font-family: 'Inter', sans-serif
    }

    #toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: #1a1d2e;
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-xl);
      z-index: 9999;
      display: none;
      border-left: 4px solid var(--blue)
    }

    #toast.show {
      display: block;
      animation: toastSlide .3s ease
    }

    #toast.hide {
      animation: toastFade .3s ease forwards
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="page-header">
      <div class="page-header-left">
        <h1>📋 Kiểm Kê Tài Sản - Sàn Lầu 2 &amp; Lầu 3</h1>
        <p>Mỗi dãy A / B / C — Lead bên trái, vách ngăn ở giữa, Agent bên phải</p>
      </div>
      <div class="header-right">
        <span class="header-badge" id="date-badge"></span>
      </div>
    </div>

    <div class="legend" id="legend"></div>

    <div class="detail-grid">
      <div class="stat-card">
        <div class="stat-label">📦 Thùng máy tính</div>
        <div class="stat-value" id="count-thung">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">🖥️ Màn hình 20"</div>
        <div class="stat-value" id="count-man20">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">🖥️✨ Màn hình 24"</div>
        <div class="stat-value" id="count-man24">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">🖱️ Tổng chuột</div>
        <div class="stat-value" id="count-chuot">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">⌨️ Tổng phím</div>
        <div class="stat-value" id="count-phim">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">🎧 Tai nghe USB</div>
        <div class="stat-value" id="count-tai">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">💻 Laptop bộ (Lead)</div>
        <div class="stat-value" id="count-laptop">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">👥 Tổng số chỗ</div>
        <div class="stat-value" id="count-seats">0</div>
      </div>
    </div>

    <div class="controls-panel">
      <div class="search-wrap">
        <span class="icon">🔍</span>
        <input type="text" id="search-input" placeholder="Tìm kiếm tên Agent hoặc STT..." oninput="searchEmployee()">
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="exportJSON()">💾 Xuất JSON</button>
        <button class="btn btn-success" onclick="exportExcel()">📊 Xuất Excel</button>
        <button class="btn btn-warning" onclick="document.getElementById('file-json').click()">📂 Nhập JSON</button>
        <input type="file" id="file-json" accept=".json" style="display:none" onchange="importJSON(event)">
        <button class="btn btn-primary" id="btn-sync-online" onclick="syncOnline()">☁️ Đồng bộ Online</button>
        <button class="btn btn-warning" onclick="restoreOriginalData()" title="Khôi phục dữ liệu gốc">🔄 Khôi
          Phục</button>
        <button class="btn btn-danger" onclick="resetAllInventory()">🗑️ Reset toàn bộ</button>
      </div>
    </div>

    <div id="floors-root"></div>
  </div>

  <!-- Color Picker Modal -->
  <div id="color-modal" class="color-picker-modal">
    <div class="color-picker-content">
      <h3>Chọn màu theo team</h3>
      <div class="color-grid" id="color-grid"></div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="closeColorModal()">Đóng</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script>
    document.getElementById('date-badge').innerText = new Date().toLocaleDateString('vi-VN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    const STORAGE_KEY = 'inventoryData2Floors_v2';

    /* ───────── LEGEND ───────── */
    const legendDef = [
      { label: 'Lead', cls: 'fill-lead' },
      { label: 'User', cls: 'fill-pink' },
      { label: 'Social', cls: 'fill-orange' },
      { label: 'Merchant', cls: 'fill-cyan' },
      { label: 'NightShift / Senior', cls: 'fill-yellow' },
      { label: 'SPT / PT', cls: 'fill-purple' },
      { label: 'Trống', cls: 'fill-grey' }
    ];
    document.getElementById('legend').innerHTML = legendDef.map(l =>
      `<div class="legend-item"><span class="legend-swatch ${l.cls}"></span>${l.label}</div>`).join('');

    function colorFor(name) {
      const n = (name || '').toUpperCase();
      if (n.includes('TRỐNG') || n === '') return 'fill-grey';
      if (n.includes('SENIOR') || n.includes('TRAINER')) return 'fill-yellow';
      if (n.startsWith('PT') || n.includes('PT -') || n.includes('PT-')) return 'fill-purple';
      if (n.includes('NB ')) return 'fill-orange';
      if (n === 'FULL') return 'fill-cyan';
      return 'fill-pink';
    }

    function getColorClass(id, name) {
      return customColors[id] || colorFor(name);
    }

    /* ───────── DỮ LIỆU: mỗi lầu gồm các DÃY (A,B,C...), mỗi dãy có 1 Lead (trái) + nhiều Agent (phải) ─────────
       Ghi chú: tên/STT được đọc best-effort từ ảnh sơ đồ gốc — có thể bấm vào tên bất kỳ để sửa trực tiếp trong app. */
    const floorsData = {
      "Sàn Lầu 3": [
        {
          lane: "A", leadName: "Thu Hiền - TL", startStt: 18, agents: [
            "Trần Chi", "Nguyễn Trâm", "Trần Trinh", "Nguyễn Thiên", "Đoàn Giao", "NB Content", "NB Content",
            "Lê Trinh", "Nguyễn Tỷ", "Cao Nhung", "Huỳnh Ngà", "Huỳnh Châu", "Lê Châu",

    /* ───────── STATE ───────── */
    let customNames = {};
    let customColors = {};  // Lưu màu tùy chỉnh cho mỗi cabin
    let inventoryState = {};
    // Cấu hình STT tùy chỉnh theo từng dãy và từng ô
    let laneSttRanges = {};   // lane key -> {start, end}
    let customStts = {};      // seat id -> STT riêng của ô
    let seatIndex = {}; // id -> {floor, laneIdx, kind:'lead'|'agent', name, stt}

    function laneId(floor, laneIdx) { return `${floor.replace(/\s/g, '')}_${laneIdx}`; }
    function leadId(floor, laneIdx) { return `${laneId(floor, laneIdx)}_LEAD`; }
    function agentId(floor, laneIdx, stt) { return `${laneId(floor, laneIdx)}_A${stt}`; }

    function buildSeatModel() {
      seatIndex = {};
      Object.keys(floorsData).forEach(floor => {
        floorsData[floor].forEach((lane, lIdx) => {
          const lid = leadId(floor, lIdx);
          seatIndex[lid] = { floor, laneIdx: lIdx, kind: 'lead', name: lane.leadName, laneLetter: lane.lane };
          lane.agents.forEach((name, i) => {
            const stt = lane.startStt + i;
            const id = agentId(floor, lIdx, stt);
            seatIndex[id] = { floor, laneIdx: lIdx, kind: 'agent', name, stt, laneLetter: lane.lane };
          });
        });
      });
    }
    function initSeatState(id) {
      inventoryState[id] = {
        thung: false, thung_qty: 1, man20: false, man24: false, chuot: false, chuot_qty: 1,
        phim: false, phim_qty: 1, tai: false, tai_qty: 1, laptop: false
      };
    }
    function ensureSeatState(id) { if (!inventoryState[id]) initSeatState(id); return inventoryState[id]; }
    function normalizeState() { Object.keys(seatIndex).forEach(id => ensureSeatState(id)); }

    /* ───────── LOAD / SAVE ───────── */
    function loadData() {
      buildSeatModel();
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          const data = JSON.parse(stored);
          inventoryState = data.inventoryState || {};
          customNames = data.customNames || {};
          customColors = data.customColors || {};
          laneSttRanges = data.laneSttRanges || {};
          customStts = data.customStts || {};
        } catch (e) { console.warn('LocalStorage parse failed', e); }
      }
      normalizeState();
      saveLocal(false);
      initColorPicker();
      renderAll();
    }
    function saveLocal(refresh = true) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ inventoryState, customNames, customColors, laneSttRanges, customStts }));
      if (refresh) updateCounts();
    }

    const SUPABASE_URL = "https://josvegctuwnxfpjynlxn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_76ErkOKmFh5t1ykxRKBfIA_DDn9srEc";
    const SUPABASE_TABLE = "inventory_sync";

    async function syncOnline() {
      if (isSyncing) return;
      isSyncing = true;
      const btn = document.getElementById('btn-sync-online');
      const originalText = btn.innerText;
      btn.innerText = '⏳ Đang đồng bộ...';
      btn.disabled = true;

      try {
        const payload = {
          data: {
            inventoryState,
            customNames,
            customColors,
            laneSttRanges,
            customStts,
            lastUpdate: new Date().toISOString()
          }
        };

        // Upsert data (insert or update) - replace id=1
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.1`,
          {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`
            },
            body: JSON.stringify(payload)
          }
        );

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        showToast('✅ Đã đồng bộ dữ liệu online thành công!', 'success');
        console.log('Sync success at:', new Date().toISOString());
      } catch (err) {
        showToast(`❌ Lỗi kết nối: ${err.message}`, 'error');
        console.error('Sync error:', err);
      } finally {
        btn.innerText = originalText;
        btn.disabled = false;
        isSyncing = false;
      }
    }

    async function loadOnline() {
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.1`,
          {
            method: 'GET',
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`
            }
          }
        );

        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const results = await response.json();

        if (results && results.length > 0) {
          const serverData = results[0].data;
          if (serverData && Object.keys(serverData.inventoryState || {}).length > 0) {
            // Only load if server has actual data (not empty)
            inventoryState = serverData.inventoryState || {};
            customNames = serverData.customNames || {};
            customColors = serverData.customColors || {};
            laneSttRanges = serverData.laneSttRanges || {};
            customStts = serverData.customStts || {};
            normalizeState();
            saveLocal(false);
            renderAll();
            showToast('✅ Đã tải dữ liệu từ server!', 'success');
            console.log('Load success at:', serverData.lastUpdate);
          } else {
            console.log('Server data is empty, keeping local data');
            showToast('ℹ️ Server chưa có dữ liệu, sử dụng dữ liệu local', 'info');
          }
        }
      } catch (err) {
        console.error('Load online error:', err);
        showToast('⚠️ Không thể tải dữ liệu từ server, sử dụng dữ liệu local', 'error');
      }
    }

    /* ───────── STT / TIÊU ĐỀ DÃY ───────── */
    function getLaneKey(floor, lIdx) { return `${floor}__${lIdx}`; }

    function getLaneStart(floor, lIdx, lane) {
      const key = getLaneKey(floor, lIdx);
      return Number.isInteger(laneSttRanges[key]?.start) ? laneSttRanges[key].start : lane.startStt;
    }

    function getLaneEnd(floor, lIdx, lane) {
      const key = getLaneKey(floor, lIdx);
      return Number.isInteger(laneSttRanges[key]?.end)
        ? laneSttRanges[key].end
        : getLaneStart(floor, lIdx, lane) + lane.agents.length - 1;
    }

    function getSeatStt(floor, lIdx, lane, i) {
      const id = agentId(floor, lIdx, lane.startStt + i);
      return customStts[id] != null ? customStts[id] : getLaneStart(floor, lIdx, lane) + i;
    }

    function startEditLaneStt(floor, lIdx) {
      const key = getLaneKey(floor, lIdx);
      const lane = floorsData[floor][lIdx];
      const start = getLaneStart(floor, lIdx, lane);
      const end = getLaneEnd(floor, lIdx, lane);
      const el = document.getElementById(`lane-stt-${lIdx}-${btoa(unescape(encodeURIComponent(floor))).replace(/[^a-zA-Z0-9]/g, '')}`);
      if (!el) return;
      el.innerHTML = `<input class="lane-stt-input" type="number" value="${start}" min="0"
      onchange="confirmLaneStt('${encodeURIComponent(floor)}',${lIdx},this.value)"
      onkeydown="if(event.key==='Enter') this.blur()"> <span>–</span>
      <input class="lane-stt-input" type="number" value="${end}" min="0"
      onchange="confirmLaneSttEnd('${encodeURIComponent(floor)}',${lIdx},this.value)"
      onkeydown="if(event.key==='Enter') this.blur()">`;
      el.querySelector('input')?.focus();
    }

    function confirmLaneStt(floorEncoded, lIdx, value) {
      const floor = decodeURIComponent(floorEncoded);
      const lane = floorsData[floor][lIdx];
      let start = parseInt(value);
      if (isNaN(start) || start < 0) start = 1;
      const end = start + lane.agents.length - 1;
      laneSttRanges[getLaneKey(floor, lIdx)] = { start, end };
      // Khi đổi đầu dãy, các ô chưa được chỉnh riêng sẽ chạy theo dãy mới
      lane.agents.forEach((_, i) => {
        const id = agentId(floor, lIdx, lane.startStt + i);
        if (customStts[id] == null) customStts[id] = start + i;
      });
      saveLocal(false); renderAll();
    }

    function confirmLaneSttEnd(floorEncoded, lIdx, value) {
      const floor = decodeURIComponent(floorEncoded);
      const lane = floorsData[floor][lIdx];
      let end = parseInt(value);
      if (isNaN(end) || end < 0) end = getLaneStart(floor, lIdx, lane) + lane.agents.length - 1;
      const start = end - lane.agents.length + 1;
      laneSttRanges[getLaneKey(floor, lIdx)] = { start, end };
      lane.agents.forEach((_, i) => {
        const id = agentId(floor, lIdx, lane.startStt + i);
        if (customStts[id] == null) customStts[id] = start + i;
      });
      saveLocal(false); renderAll();
    }

      if (!floorsData[floor] || !floorsData[floor][lIdx]) return;
      const lane = floorsData[floor][lIdx];
      lane.agents.push('Trống');
      buildSeatModel(); normalizeState(); saveLocal(false); renderAll();
      showToast('➕ Đã thêm 1 cabin mới!', 'success');

    function removeAgent(floor, lIdx, agentIdx) {
      if (!floorsData[floor] || !floorsData[floor][lIdx]) return;
      const lane = floorsData[floor][lIdx];
      if (agentIdx < 0 || agentIdx >= lane.agents.length) return;
      lane.agents.splice(agentIdx, 1);
      buildSeatModel(); normalizeState(); saveLocal(false); renderAll();
      showToast('➖ Đã xoá 1 cabin!', 'success');

    function moveAgentUp(floor, lIdx, agentIdx) {
      if (!floorsData[floor] || !floorsData[floor][lIdx] || agentIdx <= 0) return;

      buildSeatModel(); saveLocal(false); renderAll();
      showToast('⬆️ Đã di chuyển cabin lên!', 'success');

      if (!floorsData[floor] || !floorsData[floor][lIdx] || agentIdx >= floorsData[floor][lIdx].agents.length - 1) return;

      [lane.agents[agentIdx + 1], lane.agents[agentIdx]] = [lane.agents[agentIdx], lane.agents[agentIdx + 1]];

    </div>

    <div class="lane-divider">
     <div class="lane-divider-bar"></div>
     <div class="lane-divider-label">${lane.lane}</div>
    </div>

    <div class="lane-agents-wrap">
     <div class="lane-agents-label"><span id="lane-stt-${lIdx}-${btoa(unescape(encodeURIComponent(floor))).replace(/[^a-zA-Z0-9]/g, '')}" class="lane-stt-title" onclick="startEditLaneStt('${floor}',${lIdx})" title="Nhấn để sửa khoảng STT">Agent (STT ${getLaneStart(floor, lIdx, lane)}–${getLaneEnd(floor, lIdx, lane)}) <button class="btn-mini" style="background:var(--green);color:#fff;padding:2px 6px;font-size:10px;margin-left:6px" onclick="addAgent('${floor}',${lIdx})">+</button></span></div>
     <div class="seat-strip">`;

          lane.agents.forEach((name, i) => {
            const stt = lane.startStt + i;
            const id = agentId(floor, lIdx, stt);
            const displayName = customNames[id] || name;
            const isEmpty = displayName.toUpperCase().includes('TRỐNG');
            const cls = getColorClass(id, displayName);
            const state = ensureSeatState(id);
            html += `<div class="seat-box ${cls} ${isEmpty ? 'empty-seat' : ''}" data-id="${id}" data-name="${displayName.toLowerCase()}" data-stt="${getSeatStt(floor, lIdx, lane, i)}">
      <div id="stt-wrap-${id}" class="seat-stt" onclick="startEditSeatStt('${id}')" title="Nhấn để sửa STT">STT ${getSeatStt(floor, lIdx, lane, i)}</div>
      <div class="seat-header">
       <div id="name-wrap-${id}" class="seat-name" onclick="startRename('${id}')" title="Nhấn để sửa tên">${displayName}</div>
      </div>
      <div class="btn-action-group">
       <button class="btn-mini btn-mini-success" onclick="openColorModal('${id}')" title="Chỉnh màu">🎨</button>
       <button class="btn-mini btn-mini-success" onclick="markFull('${id}')">Đủ bộ</button>
       <button class="btn-mini btn-mini-danger" onclick="resetSeat('${id}')">Reset</button>
       <button class="btn-mini btn-mini-danger" onclick="removeAgent('${floor}',${lIdx},${i})" title="Xoá cabin">✕</button>
      </div>
      ${getItemsHtml(id, state, false)}
     </div>`;
          });
          html += `</div></div></div>`;
        });
        html += `</div>`;
      });
      root.innerHTML = html;
      updateCounts();
    }

    function updateCounts() {
      let thung = 0, man20 = 0, man24 = 0, chuot = 0, phim = 0, tai = 0, laptop = 0, seats = 0;
      Object.keys(seatIndex).forEach(id => {
        seats++;
        const s = inventoryState[id]; if (!s) return;
        if (s.thung) thung += (s.thung_qty || 1);
        if (s.man20) man20 += 1;
        if (s.man24) man24 += 1;
        if (s.chuot) chuot += (s.chuot_qty || 1);
        if (s.phim) phim += (s.phim_qty || 1);
        if (s.tai) tai += (s.tai_qty || 1);
        if (s.laptop) laptop += 1;
      });
      document.getElementById('count-thung').innerText = thung;
      document.getElementById('count-man20').innerText = man20;
      document.getElementById('count-man24').innerText = man24;
      document.getElementById('count-chuot').innerText = chuot;
      document.getElementById('count-phim').innerText = phim;
      document.getElementById('count-tai').innerText = tai;
      document.getElementById('count-laptop').innerText = laptop;
      document.getElementById('count-seats').innerText = seats;
    }

    /* ───────── SEARCH ───────── */
    function searchEmployee() {
      const val = document.getElementById('search-input').value.toLowerCase().trim();
      document.querySelectorAll('.seat-box').forEach(box => {
        const name = box.getAttribute('data-name') || '';
        const stt = String(box.getAttribute('data-stt') || '');
        const match = !val || name.includes(val) || stt.includes(val);
        box.style.display = match ? '' : 'none';
      });
    }

    /* ───────── RESET / EXPORT / IMPORT ───────── */
    function restoreOriginalData() {
      if (confirm('🔄 Khôi phục dữ liệu gốc? Tất cả chỉnh sửa sẽ bị mất!')) {
        // Clear all state
        inventoryState = {};
        customNames = {};
        customColors = {};
        laneSttRanges = {};
        customStts = {};

        // Rebuild model from floorsData
        buildSeatModel();
        normalizeState();

        // Clear localStorage
        localStorage.removeItem(STORAGE_KEY);

        // Re-render
        saveLocal(false);
        renderAll();
        showToast('✅ Đã khôi phục dữ liệu gốc! Các dãy A, B, C, D đã được hiển thị lại.', 'success');
      }
    }

    function resetAllInventory() {
      if (confirm('BẠN CÓ CHẮC MUỐN RESET TOÀN BỘ DỮ LIỆU KIỂM KÊ?')) {
        Object.keys(seatIndex).forEach(id => initSeatState(id));
        saveLocal(); renderAll();
        showToast('🗑️ Đã làm sạch toàn bộ dữ liệu kiểm kê.', 'success');
      }
    }
    function exportJSON() {
      const data = { inventoryState, customNames, customColors, laneSttRanges, customStts };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'inventory_2sang_' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      showToast('💾 Đã xuất JSON thành công!', 'success');
    }
    function exportExcel() {
      let html = '<table border="1"><tr><th>Sàn</th><th>Dãy</th><th>Vai trò</th><th>STT</th><th>Tên</th><th>Thùng</th><th>Màn 20"</th><th>Màn 24"</th><th>Chuột</th><th>Phím</th><th>Tai nghe</th><th>Laptop bộ</th></tr>';
      Object.keys(floorsData).forEach(floor => {
        floorsData[floor].forEach((lane, lIdx) => {
          const lid = leadId(floor, lIdx);
          const leadName = customNames[lid] || lane.leadName;
          const ls = inventoryState[lid] || {};
          html += `<tr><td>${floor}</td><td>${lane.lane}</td><td>Lead</td><td>-</td><td>${leadName}</td>
    <td>${ls.thung ? (ls.thung_qty || 1) : ''}</td><td>${ls.man20 ? 1 : ''}</td><td>${ls.man24 ? 1 : ''}</td>
    <td>${ls.chuot ? (ls.chuot_qty || 1) : ''}</td><td>${ls.phim ? (ls.phim_qty || 1) : ''}</td>
    <td>${ls.tai ? (ls.tai_qty || 1) : ''}</td><td>${ls.laptop ? 1 : ''}</td></tr>`;
          lane.agents.forEach((name, i) => {
            const stt = lane.startStt + i;
            const id = agentId(floor, lIdx, stt);
            const displayName = customNames[id] || name;
            const s = inventoryState[id] || {};
            html += `<tr><td>${floor}</td><td>${lane.lane}</td><td>Agent</td><td>${stt}</td><td>${displayName}</td>
     <td>${s.thung ? (s.thung_qty || 1) : ''}</td><td>${s.man20 ? 1 : ''}</td><td></td>
     <td>${s.chuot ? (s.chuot_qty || 1) : ''}</td><td>${s.phim ? (s.phim_qty || 1) : ''}</td>
     <td>${s.tai ? (s.tai_qty || 1) : ''}</td><td></td></tr>`;
          });
        });
      });
      html += '</table>';
      const blob = new Blob([html], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'inventory_2sang_' + new Date().toISOString().slice(0, 10) + '.xls';
      a.click();
      showToast('📊 Đã xuất Excel thành công!', 'success');
    }
    function importJSON(event) {
      const file = event.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const j = JSON.parse(e.target.result);
          if (j.inventoryState) inventoryState = j.inventoryState;
          if (j.customNames) customNames = j.customNames;
          if (j.customColors) customColors = j.customColors;
          normalizeState(); saveLocal(); renderAll();
          showToast('📂 Đã nhập JSON thành công!', 'success');
        } catch (err) { showToast('❌ File JSON không hợp lệ!', 'error'); console.error(err); }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    let toastTimeout;
    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.innerText = msg; t.className = 'show type-' + type;
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => { t.className = 'hide type-' + type; }, 3000);
    }

    loadData();
  </script>
</body>

</html>
