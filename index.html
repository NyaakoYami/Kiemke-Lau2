<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiểm Kê Tài Sản - Sàn Lầu 2 & Lầu 3</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-18px) }
      to { opacity: 1; transform: translateY(0) }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px) }
      to { opacity: 1; transform: translateY(0) }
    }
    @keyframes pageReveal {
      from { opacity: 0; transform: translateY(10px) }
      to { opacity: 1; transform: translateY(0) }
    }
    @keyframes toastSlide {
      from { opacity: 0; transform: translateX(60px) }
      to { opacity: 1; transform: translateX(0) }
    }
    @keyframes toastFade {
      from { opacity: 1; transform: translateX(0) }
      to { opacity: 0; transform: translateX(60px) }
    }

    :root {
      --bg: #f0f2f7; --surface: #fff; --surface-alt: #f8f9fc;
      --border: #e2e6ef; --text-primary: #1a1d2e; --text-secondary: #6b7280;
      --text-muted: #9ca3af; --blue: #3b5bdb; --blue-light: #eef2ff;
      --green: #2f9e44; --green-light: #ebfbee; --red: #e03131;
      --red-light: #fff5f5; --yellow: #f59f00; --yellow-light: #fff9db;
      --purple: #7048e8; --shadow-sm: 0 1px 3px rgba(0, 0, 0, .07);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, .08); --shadow-xl: 0 20px 60px rgba(0, 0, 0, .14);
      --radius: 10px; --radius-sm: 6px; --transition: .18s cubic-bezier(.4, 0, .2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0 }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-primary);
      min-height: 100vh; padding: 20px; padding-bottom: 80px;
      animation: pageReveal .45s ease both;
    }
    .container { max-width: 2000px; margin: 0 auto; }

    /* Header & Stats */
    .page-header {
      background: linear-gradient(135deg, #1a1d2e 0%, #2d3561 55%, #3b5bdb 100%);
      border-radius: 16px; padding: 26px 34px; margin-bottom: 18px;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      box-shadow: var(--shadow-xl);
    }
    .page-header-left h1 { color: #fff; font-size: 23px; font-weight: 800; }
    .page-header-left p { color: rgba(255,255,255,.65); font-size: 13px; margin-top: 4px; }
    .header-badge { background: rgba(255,255,255,.12); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }

    .legend { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .legend-item { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; color: var(--text-secondary); }
    .legend-swatch { width: 12px; height: 12px; border-radius: 3px; }

    .detail-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; margin-bottom: 18px; }
    .stat-card { background: var(--surface); border-radius: var(--radius); padding: 10px 13px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
    .stat-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
    .stat-value { font-size: 20px; font-weight: 800; color: var(--text-primary); }

    /* Controls */
    .controls-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 18px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .search-wrap input { padding: 9px 12px 9px 36px; width: 280px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; outline: none; }
    .btn { padding: 9px 16px; border: none; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 13px; transition: transform var(--transition); }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-success { background: var(--green); color: #fff; }
    .btn-warning { background: var(--yellow); color: #fff; }

    /* Floors and Lanes */
    .floor-block { margin-bottom: 26px; }
    .floor-title { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 18px; font-weight: 800; }
    
    .lane-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow-sm); display: flex; align-items: stretch; overflow-x: auto; min-height: 120px; }
    .lane-lead-wrap { display: flex; flex-direction: column; flex-shrink: 0; width: 170px; margin-right: 10px; }
    .lane-divider { flex-shrink: 0; width: 34px; display: flex; align-items: center; justify-content: center; position: relative; margin-right: 10px; }
    .lane-divider-bar { width: 3px; height: 100%; background: repeating-linear-gradient(180deg, #c8d0db 0 6px, transparent 6px 12px); }
    .lane-divider-label { position: absolute; background: #1a1d2e; color: #fff; font-weight: 800; font-size: 14px; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .lane-agents-wrap { display: flex; flex-direction: column; flex: 1; }
    
    .lane-header-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .lane-agents-label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
    .stt-config { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--text-secondary); background: var(--surface-alt); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); }
    .stt-config input { width: 40px; padding: 2px 4px; border: 1px solid var(--border); border-radius: 3px; font-size: 11px; text-align: center; }
    
    .seat-strip { display: flex; flex-wrap: wrap; gap: 8px; min-height: 80px; padding: 4px; border: 2px dashed transparent; border-radius: 8px; }
    .seat-strip.drag-over { border-color: var(--blue); background: rgba(59, 91, 219, 0.05); }

    /* Seats */
    .seat-box { width: 125px; border-radius: var(--radius-sm); padding: 8px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); flex-shrink: 0; cursor: grab; transition: transform var(--transition); background: var(--surface); }
    .seat-box:active { cursor: grabbing; }
    .seat-box:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); z-index: 2; }
    .seat-box.lead-box { width: 160px; }
    
    .fill-purple { background: #f0ebff; border-color: #c5b4f5; }
    .fill-pink { background: #fff0f6; border-color: #fbb6ce; }
    .fill-yellow { background: var(--yellow-light); border-color: #ffe066; }
    .fill-green { background: var(--green-light); border-color: #b2f2bb; }
    .fill-red { background: var(--red-light); border-color: #fca5a5; }
    .fill-orange { background: #fff4e6; border-color: #ffd8a8; }
    .fill-cyan { background: #e3fafc; border-color: #99e9f2; }
    .fill-grey { background: #f1f3f5; border-color: #dee2e6; opacity: 0.7; }
    .fill-lead { background: #e7f5ff; border-color: #74c0fc; }

    .seat-header { display: flex; justify-content: space-between; margin-bottom: 5px; align-items: flex-start; }
    .seat-name-wrap { flex: 1; overflow: hidden; }
    .seat-stt { font-size: 9px; font-weight: 800; color: var(--blue-dark); cursor: pointer; padding: 1px 3px; border-radius: 3px; background: rgba(0,0,0,0.05); display: inline-block; margin-bottom: 2px; }
    .seat-name { font-size: 11px; font-weight: 700; cursor: pointer; line-height: 1.2; word-wrap: break-word; }
    
    .edit-input { width: 100%; font-size: 10px; font-weight: 700; border: 1px solid var(--blue); border-radius: 3px; padding: 2px; outline: none; }
    
    .btn-action-group { display: flex; gap: 4px; margin-bottom: 4px; position: relative; }
    .btn-mini { padding: 2px 5px; font-size: 9px; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; background: rgba(0,0,0,0.05); }
    .btn-mini:hover { background: rgba(0,0,0,0.1); }
    .btn-mini-danger { color: var(--red); }
    .btn-mini-danger:hover { background: var(--red-light); }
    .btn-mini-success { color: var(--green); background: var(--green-light); border: 1px dashed var(--green); margin-bottom: 8px; width: fit-content; }
    
    /* Hover Color Picker */
    .color-wrapper { position: relative; display: inline-block; }
    .color-popover { display: none; position: absolute; top: 100%; left: 0; background: var(--surface); border: 1px solid var(--border); padding: 6px; border-radius: 6px; box-shadow: var(--shadow-md); z-index: 100; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 80px; }
    .color-wrapper:hover .color-popover { display: grid; }
    .color-swatch-btn { width: 20px; height: 20px; border-radius: 4px; cursor: pointer; border: 1px solid rgba(0,0,0,0.1); }
    .color-swatch-btn:hover { transform: scale(1.1); }

    /* Checklist */
    .items-list { display: flex; flex-direction: column; gap: 2px; background: rgba(255,255,255,0.6); padding: 4px; border-radius: 5px; }
    .item-check { display: flex; align-items: center; gap: 4px; font-size: 9px; font-weight: 600; color: var(--text-secondary); }
    .item-check input[type=checkbox] { cursor: pointer; width: 10px; height: 10px; accent-color: var(--green); }
    .item-lbl { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qty-input { width: 24px; padding: 0 2px; font-size: 9px; border: 1px solid var(--border); border-radius: 3px; text-align: center; }

    #toast { position: fixed; bottom: 28px; right: 28px; background: #1a1d2e; color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; display: none; z-index: 9999; }
    #toast.show { display: block; animation: toastSlide .3s ease; }
    #toast.hide { animation: toastFade .3s ease forwards; }
  </style>
</head>

<body>
  <div class="container">
    <div class="page-header">
      <div class="page-header-left">
        <h1>📋 Kiểm Kê Tài Sản - Sàn Lầu 2 &amp; Lầu 3</h1>
        <p>Phiên bản nâng cấp: 4 Dãy (A/B/C/D), Kéo thả Cabin, Đổi màu nhanh, Thêm/Xoá tuỳ chỉnh.</p>
      </div>
      <div class="header-right">
        <span class="header-badge" id="date-badge"></span>
      </div>
    </div>

    <div class="legend" id="legend"></div>

    <div class="detail-grid">
      <div class="stat-card"><div class="stat-label">📦 Thùng máy</div><div class="stat-value" id="count-thung">0</div></div>
      <div class="stat-card"><div class="stat-label">🖥️ Màn 20"</div><div class="stat-value" id="count-man20">0</div></div>
      <div class="stat-card"><div class="stat-label">🖥️✨ Màn 24"</div><div class="stat-value" id="count-man24">0</div></div>
      <div class="stat-card"><div class="stat-label">🖱️ Chuột</div><div class="stat-value" id="count-chuot">0</div></div>
      <div class="stat-card"><div class="stat-label">⌨️ Phím</div><div class="stat-value" id="count-phim">0</div></div>
      <div class="stat-card"><div class="stat-label">🎧 Tai USB</div><div class="stat-value" id="count-tai">0</div></div>
      <div class="stat-card"><div class="stat-label">💻 Laptop</div><div class="stat-value" id="count-laptop">0</div></div>
      <div class="stat-card"><div class="stat-label">👥 Tổng chỗ</div><div class="stat-value" id="count-seats">0</div></div>
    </div>

    <div class="controls-panel">
      <div class="search-wrap">
        <input type="text" id="search-input" placeholder="🔍 Tìm kiếm tên Agent hoặc STT..." oninput="renderApp()">
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="exportJSON()">💾 Lấy JSON</button>
        <button class="btn btn-warning" onclick="document.getElementById('file-json').click()">📂 Nhập JSON</button>
        <input type="file" id="file-json" accept=".json" style="display:none" onchange="importJSON(event)">
        <button class="btn btn-success" onclick="resetToDefault()">🔄 Khôi phục Mặc định</button>
      </div>
    </div>

    <div id="floors-container"></div>
  </div>

  <div id="toast"></div>

  <script>
    document.getElementById('date-badge').innerText = new Date().toLocaleDateString('vi-VN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    const STORAGE_KEY = 'inventoryApp_Dynamic';
    
    // Màu theo team
    const teamColors = [
      { id: 'fill-lead', name: 'Lead' }, { id: 'fill-pink', name: 'User' },
      { id: 'fill-orange', name: 'Social' }, { id: 'fill-cyan', name: 'Merchant' },
      { id: 'fill-yellow', name: 'Night/Senior' }, { id: 'fill-purple', name: 'SPT/PT' },
      { id: 'fill-grey', name: 'Trống' }
    ];

    document.getElementById('legend').innerHTML = teamColors.map(c => 
      `<div class="legend-item"><span class="legend-swatch ${c.id}"></span>${c.name}</div>`
    ).join('');

    // Hàm tạo ID ngẫu nhiên cho cabin
    const genId = () => 's_' + Math.random().toString(36).substr(2, 9);

    // Dữ liệu mặc định đã chia thành 4 dãy
    const defaultData = [
      {
        floorName: "Sàn Lầu 3",
        lanes: [
          { laneLetter: "A", startStt: 18, leads: [{id: genId(), name: "Thu Hiền - TL"}], agents: [
            "Trần Chi", "Nguyễn Trâm", "Trần Trinh", "Nguyễn Thiên", "Đoàn Giao", "NB Content", "NB Content",
            "Lê Trinh", "Nguyễn Tỷ", "Cao Nhung", "Huỳnh Ngà", "Huỳnh Châu", "Lê Châu", "Trống", "Trống", "Trống"
          ].map((n, i) => ({id: genId(), name: n, stt: 18 + i})) },
          
          { laneLetter: "B", startStt: 38, leads: [{id: genId(), name: "Vy - DA"}], agents: [
            "Nguyễn Khanh", "Lý - Senior", "Nguyễn Hậu", "Võ Hiền", "Phan Loan", "Võ Lan", "NB Content", "NB Content", "Tuyến - Senior", "Nguyễn Thúy"
          ].map((n, i) => ({id: genId(), name: n, stt: 38 + i})) },
          
          { laneLetter: "C", startStt: 48, leads: [{id: genId(), name: "Lead Hỗ Trợ"}], agents: [
            "Huỳnh Giang", "Trần Tâm", "Nguyễn Phương", "Ngô Hằng", "Lai Nghi", "NB Tele", "Trống", "Trống", "Trống", "Trống"
          ].map((n, i) => ({id: genId(), name: n, stt: 48 + i})) },

          { laneLetter: "D", startStt: 58, leads: [{id: genId(), name: "Anh Thư - SUP"}], agents: [
            "Full", "Full", "PT - Phúc Hậu", "Trung Hiếu", "Quốc Khánh", "Trống", "Nhung Huỳnh", "Yến Ly", "Gia Hưng", "Bích Quỳnh", "PT - Phương Thy", "PT - Khánh Vy", "PT - Liên Anh", "PT - Thu Hồng", "PT - Loan", "PT - Cắt Tường", "PT - Khoa"
          ].map((n, i) => ({id: genId(), name: n, stt: 58 + i})) }
        ]
      },
      {
        floorName: "Sàn Lầu 2",
        lanes: [
          { laneLetter: "A", startStt: 1, leads: [{id: genId(), name: "Oanh - Senior TL"}], agents: [
            "Trống", "Thiên Kim Senior", "Kim Ái Senior", "Huy Hoàng", "Diệu Trinh", "PT Thảo Phương", "PT Sỹ Danh", "PT Trúc Linh", "PT Thu Hiền", "Full", "PT Thành Đạt", "Full", "PT - Gia Hân", "PT - Sang", "PT - Trang", "PT - Huy", "PT - Gia Bội", "PT - Hào"
          ].map((n, i) => ({id: genId(), name: n, stt: 1 + i})) },
          
          { laneLetter: "B", startStt: 19, leads: [{id: genId(), name: "Chinh - TL"}], agents: [
            "Thiên Ngân", "Tú Trinh", "Trung Nghị", "Minh Tâm", "Minh Thư", "Duy Khánh", "Hồng Ân", "Nhật Lam", "Khánh Ly", "Hoàng Gấm NB", "Hoàng Khải", "Phi Phụng", "Bảo Anh Senior", "Ngọc Tú", "Uyên", "Thanh", "PT Bảo My", "Full", "Cảnh", "Trúc"
          ].map((n, i) => ({id: genId(), name: n, stt: 19 + i})) },

          { laneLetter: "C", startStt: 39, leads: [{id: genId(), name: "Lead Hỗ Trợ 2"}], agents: [
            "Thiếu 1 màn hình", "Thiếu 1 màn hình", "Full", "Trực", "Kim Ngân", "Đan Vy", "Nguyễn Senior", "Thắng", "Full", "Nguyễn Kim Ngân", "Thị Thủy", "Ý Lan", "Hải Yến", "Ái Linh", "Hân Senior", "Minh Thái", "Quang Hậu", "Công Hiệp", "Full", "Minh Hoàng"
          ].map((n, i) => ({id: genId(), name: n, stt: 39 + i})) },

          { laneLetter: "D", startStt: 59, leads: [{id: genId(), name: "Phương - TL QA"}], agents: [
            "Hoàng Khôi", "Minh Đạo", "Văn Anh", "Kim Chi", "Thảo Vi", "Thừa Nghiên", "Mai Xuân", "Thị Quỳnh", "Nguyễn Nhi", "Thị Hồng", "Chấn Điền", "Nhật Khánh", "Tú Quyền", "Tân Tài", "Tuấn Anh", "Toàn"
          ].map((n, i) => ({id: genId(), name: n, stt: 59 + i})) }
        ]
      }
    ];

    let appState = {
      floors: [],
      inventory: {},
      colors: {}
    };

    function initChecklist(isLead) {
      if (isLead) return { thung: false, thung_qty: 1, man20: false, man24: false, chuot: false, chuot_qty: 1, phim: false, phim_qty: 1, tai: false, tai_qty: 1, laptop: false };
      return { thung: false, thung_qty: 1, man20: false, chuot: false, chuot_qty: 1, phim: false, phim_qty: 1, tai: false, tai_qty: 1 };
    }

    function autoColor(name) {
      const n = (name || '').toUpperCase();
      if (n.includes('TRỐNG') || n === '') return 'fill-grey';
      if (n.includes('SENIOR') || n.includes('TRAINER')) return 'fill-yellow';
      if (n.startsWith('PT') || n.includes('PT -')) return 'fill-purple';
      if (n.includes('NB ')) return 'fill-orange';
      if (n === 'FULL') return 'fill-cyan';
      return 'fill-pink';
    }

    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          appState = JSON.parse(saved);
        } catch(e) { console.error(e); appState.floors = JSON.parse(JSON.stringify(defaultData)); }
      } else {
        appState.floors = JSON.parse(JSON.stringify(defaultData));
      }
      
      // Đảm bảo inventory state
      appState.floors.forEach(f => f.lanes.forEach(l => {
        l.leads.forEach(ld => { if (!appState.inventory[ld.id]) appState.inventory[ld.id] = initChecklist(true); });
        l.agents.forEach(ag => { if (!appState.inventory[ag.id]) appState.inventory[ag.id] = initChecklist(false); });
      }));
      renderApp();
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      updateStats();
    }

    function resetToDefault() {
      if(confirm("Xoá toàn bộ dữ liệu hiện tại và khôi phục mặc định?")) {
        localStorage.removeItem(STORAGE_KEY);
        loadData();
      }
    }

    /* --- Tương tác Dữ liệu --- */
    function setItem(id, key, val) { appState.inventory[id][key] = val; saveData(); }
    function setColor(id, colorCls) { appState.colors[id] = colorCls; saveData(); renderApp(); }
    function updateSttGlobal(fIdx, lIdx, val) {
      const lane = appState.floors[fIdx].lanes[lIdx];
      lane.startStt = parseInt(val) || 0;
      lane.agents.forEach((ag, i) => ag.stt = lane.startStt + i);
      saveData(); renderApp();
    }

    // Edit Name / STT inline
    function editProp(fIdx, lIdx, type, sIdx, prop, val) {
      if (type === 'lead') appState.floors[fIdx].lanes[lIdx].leads[sIdx][prop] = val;
      else appState.floors[fIdx].lanes[lIdx].agents[sIdx][prop] = prop === 'stt' ? (parseInt(val)||'') : val;
      saveData(); renderApp();
    }

    // Add / Delete Seat
    function addSeat(fIdx, lIdx, type) {
      const id = genId();
      const lane = appState.floors[fIdx].lanes[lIdx];
      appState.inventory[id] = initChecklist(type === 'lead');
      if (type === 'lead') {
        lane.leads.push({ id, name: "Lead Mới" });
      } else {
        const lastStt = lane.agents.length > 0 ? (lane.agents[lane.agents.length-1].stt + 1) : lane.startStt;
        lane.agents.push({ id, name: "Trống", stt: lastStt });
      }
      saveData(); renderApp();
    }
    
    function deleteSeat(fIdx, lIdx, type, sIdx) {
      if(confirm("Xoá cabin này?")) {
        const arr = type === 'lead' ? appState.floors[fIdx].lanes[lIdx].leads : appState.floors[fIdx].lanes[lIdx].agents;
        const id = arr[sIdx].id;
        arr.splice(sIdx, 1);
        delete appState.inventory[id];
        delete appState.colors[id];
        saveData(); renderApp();
      }
    }

    /* --- Kéo Thả (Drag & Drop) --- */
    let draggedSeat = null;

    function handleDragStart(e, fIdx, lIdx, type, sIdx) {
      draggedSeat = { fIdx, lIdx, type, sIdx };
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', 'seat');
      setTimeout(() => e.target.style.opacity = '0.5', 0);
    }
    function handleDragEnd(e) {
      e.target.style.opacity = '1';
      document.querySelectorAll('.seat-strip').forEach(el => el.classList.remove('drag-over'));
      draggedSeat = null;
    }
    function handleDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function handleDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
    function handleDrop(e, targetFIdx, targetLIdx, targetType) {
      e.preventDefault();
      e.currentTarget.classList.remove('drag-over');
      if (!draggedSeat) return;
      
      const { fIdx, lIdx, type, sIdx } = draggedSeat;
      const sourceArr = type === 'lead' ? appState.floors[fIdx].lanes[lIdx].leads : appState.floors[fIdx].lanes[lIdx].agents;
      const targetArr = targetType === 'lead' ? appState.floors[targetFIdx].lanes[targetLIdx].leads : appState.floors[targetFIdx].lanes[targetLIdx].agents;
      
      // Di chuyển dữ liệu
      const [item] = sourceArr.splice(sIdx, 1);
      
      // Nếu đổi loại (Agent <-> Lead) thì phải reset checklist
      if (type !== targetType) appState.inventory[item.id] = initChecklist(targetType === 'lead');
      
      targetArr.push(item);
      saveData(); renderApp();
    }

    /* --- Render HTML --- */
    function renderApp() {
      const searchQ = document.getElementById('search-input').value.toLowerCase();
      let html = '';

      appState.floors.forEach((floor, fIdx) => {
        html += `<div class="floor-block">
          <div class="floor-title"><h2>${floor.floorName}</h2></div>`;
        
        floor.lanes.forEach((lane, lIdx) => {
          html += `<div class="lane-row">`;
          
          // --- KHOANG LEAD ---
          html += `<div class="lane-lead-wrap">
            <div class="lane-agents-label">LEAD DÃY ${lane.laneLetter}</div>
            <button class="btn-mini btn-mini-success" onclick="addSeat(${fIdx},${lIdx},'lead')">+ Thêm Lead</button>
            <div class="seat-strip" 
                 ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" 
                 ondrop="handleDrop(event, ${fIdx}, ${lIdx}, 'lead')">`;
          
          lane.leads.forEach((seat, sIdx) => {
            if (searchQ && !seat.name.toLowerCase().includes(searchQ)) return;
            html += renderSeatHTML(seat, fIdx, lIdx, 'lead', sIdx);
          });
          html += `</div></div>`;

          // --- VÁCH NGĂN ---
          html += `<div class="lane-divider"><div class="lane-divider-bar"></div>
                   <div class="lane-divider-label">${lane.laneLetter}</div></div>`;

          // --- KHOANG AGENT ---
          html += `<div class="lane-agents-wrap">
            <div class="lane-header-row">
              <div class="lane-agents-label">AGENTS DÃY ${lane.laneLetter}</div>
              <div class="stt-config">
                STT Bắt đầu: <input type="number" value="${lane.startStt}" onchange="updateSttGlobal(${fIdx}, ${lIdx}, this.value)">
              </div>
              <button class="btn-mini btn-mini-success" style="margin:0; margin-left:10px" onclick="addSeat(${fIdx},${lIdx},'agent')">+ Thêm Agent</button>
            </div>
            <div class="seat-strip" 
                 ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" 
                 ondrop="handleDrop(event, ${fIdx}, ${lIdx}, 'agent')">`;

          lane.agents.forEach((seat, sIdx) => {
            if (searchQ && !seat.name.toLowerCase().includes(searchQ) && !(seat.stt+'').includes(searchQ)) return;
            html += renderSeatHTML(seat, fIdx, lIdx, 'agent', sIdx);
          });
          html += `</div></div></div>`; // End Lane
        });
        html += `</div>`; // End Floor
      });

      document.getElementById('floors-container').innerHTML = html;
      updateStats();
    }

    function renderSeatHTML(seat, fIdx, lIdx, type, sIdx) {
      const inv = appState.inventory[seat.id] || initChecklist(type==='lead');
      const bgCls = appState.colors[seat.id] || (type==='lead' ? 'fill-lead' : autoColor(seat.name));
      const boxCls = type === 'lead' ? 'seat-box lead-box' : 'seat-box';
      
      let html = `<div class="${boxCls} ${bgCls}" draggable="true" 
                       ondragstart="handleDragStart(event, ${fIdx}, ${lIdx}, '${type}', ${sIdx})"
                       ondragend="handleDragEnd(event)">
        
        <div class="btn-action-group">
          <div class="color-wrapper">
            <button class="btn-mini">🎨</button>
            <div class="color-popover">
              ${teamColors.map(c => `<div class="color-swatch-btn ${c.id}" title="${c.name}" onclick="setColor('${seat.id}', '${c.id}')"></div>`).join('')}
            </div>
          </div>
          <button class="btn-mini btn-mini-danger" style="margin-left:auto" onclick="deleteSeat(${fIdx}, ${lIdx}, '${type}', ${sIdx})">✖</button>
        </div>

        <div class="seat-header">
          <div class="seat-name-wrap">`;
      
      if (type === 'agent') {
        html += `<input class="edit-input" style="width:35px; display:inline-block; margin-bottom:2px" value="${seat.stt||''}" 
                  onchange="editProp(${fIdx},${lIdx},'agent',${sIdx},'stt',this.value)" placeholder="STT"><br>`;
      }
      
      html += `<input class="edit-input" value="${seat.name}" onchange="editProp(${fIdx},${lIdx},'${type}',${sIdx},'name',this.value)">
          </div>
        </div>
        <div class="items-list">`;

      // Checklists
      const check = (key, lbl, hasQty=false) => `
        <label class="item-check">
          <input type="checkbox" onchange="setItem('${seat.id}','${key}',this.checked)" ${inv[key]?'checked':''}>
          <span class="item-lbl">${lbl}</span>
          ${hasQty ? `<input type="number" class="qty-input" value="${inv[key+'_qty']||1}" onchange="setItem('${seat.id}','${key}_qty',this.value)">` : ''}
        </label>`;

      if (type === 'lead') {
        html += check('thung','Thùng CPU',true) + check('man20','Màn 20"') + check('man24','Màn 24"') + 
                check('chuot','Chuột',true) + check('phim','Phím',true) + check('tai','Tai USB',true) + check('laptop','Laptop');
      } else {
        html += check('man20','Màn 20"') + check('thung','Thùng CPU',true) + check('chuot','Chuột',true) + 
                check('phim','Phím',true) + check('tai','Tai nghe',true);
      }

      html += `</div></div>`;
      return html;
    }

    /* --- Thống kê & Export --- */
    function updateStats() {
      let thung=0, man20=0, man24=0, chuot=0, phim=0, tai=0, laptop=0, seats=0;
      Object.values(appState.inventory).forEach(inv => {
        seats++;
        if(inv.thung) thung += parseInt(inv.thung_qty)||1;
        if(inv.man20) man20++;
        if(inv.man24) man24++;
        if(inv.chuot) chuot += parseInt(inv.chuot_qty)||1;
        if(inv.phim) phim += parseInt(inv.phim_qty)||1;
        if(inv.tai) tai += parseInt(inv.tai_qty)||1;
        if(inv.laptop) laptop++;
      });
      document.getElementById('count-thung').innerText = thung;
      document.getElementById('count-man20').innerText = man20;
      document.getElementById('count-man24').innerText = man24;
      document.getElementById('count-chuot').innerText = chuot;
      document.getElementById('count-phim').innerText = phim;
      document.getElementById('count-tai').innerText = tai;
      document.getElementById('count-laptop').innerText = laptop;
      document.getElementById('count-seats').innerText = seats;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg; t.className = 'show';
      setTimeout(() => t.className = 'hide', 3000);
    }

    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState));
      const el = document.createElement('a');
      el.setAttribute("href", dataStr);
      el.setAttribute("download", `KiemKe_Update_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(el); el.click(); el.remove();
      showToast("💾 Đã tải file JSON thành công!");
    }

    function importJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          appState = JSON.parse(ev.target.result);
          saveData(); renderApp();
          showToast("📂 Nạp dữ liệu thành công!");
        } catch(err) { alert("File lỗi!"); }
      };
      reader.readAsText(file);
    }

    // Khởi chạy
    loadData();
  </script>
</body>
</html>
